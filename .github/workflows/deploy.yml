name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          rsync -a --exclude='.env' --exclude='.git' . /srv/apps/career-check-bot/
          cd /srv/apps/career-check-bot
          docker compose build webapp bot
          docker compose run --rm bot alembic upgrade head
          docker compose up -d --remove-orphans
          docker compose ps
          curl -sf https://careercheck.botyard.site/api/health && echo "Health check OK" || echo "Health check failed"
