name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/careercheck
            git pull origin main
            docker compose build --no-cache webapp bot
            docker compose run --rm bot alembic upgrade head
            docker compose up -d --force-recreate webapp bot
            echo "=== Deploy complete ==="
            docker compose ps
            curl -sf https://careercheck.app/api/health && echo "Health check OK" || echo "Health check failed"
