---
- name: Deploy CareerCheck Bot
  hosts: bot
  become: yes
  vars:
    app_dir: /opt/career-bot

  tasks:
    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy docker-compose
      template:
        src: docker-compose.prod.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"

    - name: Copy .env
      template:
        src: .env.j2
        dest: "{{ app_dir }}/.env"
        mode: '0600'

    - name: Copy bot code
      synchronize:
        src: ../
        dest: "{{ app_dir }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=venv"
          - "--exclude=terraform"
          - "--exclude=ansible"
          - "--exclude=__pycache__"

    - name: Pull and start containers
      command: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"

    - name: Run database migrations
      command: docker compose exec -T postgres psql -U career_user -d career_db -f /app/db/init.sql
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes  # Если уже применено
