<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984E3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00CEC9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C5CE7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0B0E1A"/>

  <!-- Pentagon (Big Five symbol) — 5 vertices -->
  <!-- Top: 256,80 | TR: 432,200 | BR: 368,400 | BL: 144,400 | TL: 80,200 -->
  <polygon
    points="256,80 432,200 368,400 144,400 80,200"
    stroke="url(#grad1)"
    stroke-width="18"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Inner pentagon — smaller, accent color -->
  <polygon
    points="256,148 374,228 332,356 180,356 138,228"
    stroke="url(#grad2)"
    stroke-width="6"
    stroke-linejoin="round"
    fill="rgba(108,92,231,0.08)"
  />

  <!-- Radar lines from center to vertices -->
  <line x1="256" y1="240" x2="256" y2="80"  stroke="url(#grad1)" stroke-width="3" opacity="0.5"/>
  <line x1="256" y1="240" x2="432" y2="200" stroke="url(#grad1)" stroke-width="3" opacity="0.5"/>
  <line x1="256" y1="240" x2="368" y2="400" stroke="url(#grad1)" stroke-width="3" opacity="0.5"/>
  <line x1="256" y1="240" x2="144" y2="400" stroke="url(#grad1)" stroke-width="3" opacity="0.5"/>
  <line x1="256" y1="240" x2="80"  y2="200" stroke="url(#grad1)" stroke-width="3" opacity="0.5"/>

  <!-- Center dot -->
  <circle cx="256" cy="240" r="10" fill="url(#grad2)" filter="url(#glow)"/>

  <!-- Vertex dots -->
  <circle cx="256" cy="80"  r="7" fill="#6C5CE7"/>
  <circle cx="432" cy="200" r="7" fill="#6C5CE7"/>
  <circle cx="368" cy="400" r="7" fill="#6C5CE7"/>
  <circle cx="144" cy="400" r="7" fill="#6C5CE7"/>
  <circle cx="80"  cy="200" r="7" fill="#6C5CE7"/>
</svg>
